<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Mộng Tu Tiên</title>
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Lớp phủ yêu cầu xoay ngang màn hình -->
  <div id="rotate-screen-warning">
    <p>Vui lòng xoay ngang điện thoại để trải nghiệm tốt nhất!</p>
  </div>

  <!-- Sảnh Chính -->
  <div id="main-lobby" class="screen">
    <h1>Mộng Tu Tiên</h1>
    <div class="player-stats">
      <p>Cảnh giới: <span id="player-rank">Luyện Khí Kỳ</span></p>
      <p>Tu vi: <span id="player-exp">0</span> / <span id="player-max-exp">1000</span></p>
    </div>
    <div class="menu-buttons">
      <button onclick="openCultivation()">Bế Quan Tu Luyện</button>
    </div>
  </div>

  <!-- Khu vực Bế Quan Tu Luyện -->
  <div id="cultivation-screen" class="screen hidden">
    <!-- Thanh trạng thái phía trên -->
    <div class="cultivation-header">
      <div class="timer-badge">⏳ <span id="cultivation-timer">02:00</span></div>
      <div class="lives-container" id="cultivation-lives">
        <span class="life-icon">❤️</span>
        <span class="life-icon">❤️</span>
        <span class="life-icon">❤️</span>
      </div>
      <button id="btn-stop-cultivation" class="btn-stop" onclick="stopCultivation('manual')">🚪 Xuất Quan</button>
    </div>

    <!-- Khu vực hiển thị câu hỏi -->
    <div class="quiz-body">
      <h2 class="question-title" id="quiz-question">Đang tải khẩu quyết...</h2>
      <div class="options-grid" id="quiz-options">
        <!-- Nút đáp án sẽ được JS sinh ra ở đây -->
      </div>
    </div>
  </div>

  <!-- Modal Tổng kết xuất quan -->
  <div id="cultivation-summary-modal" class="modal-overlay hidden">
    <div class="modal-card">
      <h3 id="summary-title">Kết Thúc Bế Quan</h3>
      <p id="summary-reason" class="summary-reason"></p>
      <div class="summary-stats">
        <p>Số câu đúng: <b id="summary-correct">0</b></p>
        <p>Tu vi lĩnh ngộ: <b id="summary-exp" class="exp-text">+0</b></p>
      </div>
      <button class="btn-confirm" onclick="closeCultivationModal()">Xác Nhận</button>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
